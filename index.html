<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090e"><link rel="manifest" href="manifest.json"><title>Kaung AI Editor</title>
<style>
:root{color-scheme:dark;--bg:#08090e;--panel:#151721;--panel2:#20232e;--line:#303442;--text:#f7f7fb;--muted:#9ba0b1;--violet:#8f72ff;--aqua:#4bdcc9;--gold:#f6c84a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;padding-bottom:22px}button{border:0;color:inherit;background:none;font:inherit;cursor:pointer}header{height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222530;position:sticky;top:0;background:#0b0c12;z-index:5}.headgroup{display:flex;align-items:center;gap:11px}.back{font-size:23px;color:#d6d8e2}.title{font-weight:750}.save{background:var(--violet);padding:9px 15px;border-radius:9px;font-weight:750}.stage{height:min(47vh,430px);min-height:270px;background:#050609;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage video{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;display:none;background:#000}.empty{width:min(65vw,260px);aspect-ratio:9/16;border-radius:15px;background:#141620;border:1px dashed #4b5060;display:grid;place-items:center;text-align:center;padding:18px;color:var(--muted)}.empty button{font-size:39px;color:var(--aqua)}.textLayer{position:absolute;bottom:17%;left:12%;right:12%;text-align:center;font-size:22px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none;white-space:pre-wrap}.timebar{display:flex;align-items:center;justify-content:center;gap:20px;padding:9px;color:#e9e9ef}.play{width:38px;height:38px;border-radius:50%;background:#242733;font-size:17px}.timer{font-variant-numeric:tabular-nums;color:#ced0da}.edit{padding:0 14px}.trackhead{display:flex;align-items:center;justify-content:space-between;margin:9px 0;color:var(--muted);font-size:12px}.timeline{height:82px;background:#141620;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;padding:7px}.clip{height:56px;flex:1;border:2px solid var(--aqua);border-radius:7px;background:linear-gradient(90deg,#242840,#302850,#202b3c);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#d4d6e1;font-size:12px}.clip span{background:#0b0c12b8;padding:3px 8px;border-radius:5px}.needle{position:absolute;left:8px;top:7px;bottom:7px;width:2px;background:#fff;z-index:2}.needle:before{content:"";position:absolute;top:-3px;left:-4px;width:10px;height:10px;border-radius:50%;background:white}.seek{width:100%;margin:8px 0 2px;accent-color:var(--aqua)}.rangegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rangebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.rangebox label{font-size:11px;color:var(--muted)}.rangebox output{float:right;color:var(--aqua);font-variant-numeric:tabular-nums}.rangebox input{width:100%;accent-color:var(--aqua);margin:7px 0 0}.quick{display:flex;gap:8px;margin:11px 0 12px}.qbtn{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 4px;font-size:12px}.qbtn.active{border-color:var(--violet);color:#d8ceff}.toolstrip{position:sticky;bottom:0;background:#11131b;border-top:1px solid #2a2d39;display:grid;grid-template-columns:repeat(6,1fr);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:6}.tool{display:grid;justify-items:center;gap:4px;color:#aeb2c0;font-size:10px}.tool i{font-style:normal;font-size:20px}.tool:active,.tool.active{color:#c9bcff}.tool input{display:none}.aiPanel{display:none;background:#171925;border:1px solid #373b4d;border-radius:13px;padding:12px;margin:12px 0}.aiPanel.show{display:block}.field{width:100%;border:1px solid #3c4052;background:#0d0f17;color:var(--text);padding:11px;border-radius:9px;font:inherit}.airow{display:flex;gap:8px;margin-top:8px}.airow .field{flex:1;min-width:0}.small{color:var(--muted);font-size:11px;line-height:1.5;margin:7px 0 0}.msg{font-size:12px;color:var(--aqua);margin-top:8px;white-space:pre-wrap}.audioStatus{display:none}.hiddenInput{display:none}@media(min-width:700px){body{max-width:520px;margin:auto;border-left:1px solid #20222c;border-right:1px solid #20222c}.stage{height:400px}}
</style></head>
<body>
<header><div class="headgroup"><button class="back" aria-label="နောက်သို့">‹</button><div><div class="title">Kaung AI Editor</div><div style="font-size:10px;color:var(--muted)">ဗီဒီယိုတည်းဖြတ်ရန်</div></div></div><button id="export" class="save">ထုတ်ယူရန်</button></header>
<section class="stage"><div id="empty" class="empty"><div><button id="addVideo" aria-label="ဗီဒီယိုထည့်ရန်">＋</button><div>ဗီဒီယိုထည့်ရန်<br><small>ဖုန်းထဲကဗီဒီယိုကို ရွေးပါ</small></div></div></div><video id="video" playsinline></video><div id="textLayer" class="textLayer"></div></section>
<div class="timebar"><span id="current" class="timer">00:00</span><button id="play" class="play">▶</button><span id="duration" class="timer">00:00</span></div>
<main class="edit"><div class="trackhead"><span>အချိန်လိုင်း</span><button id="split" class="qbtn" style="flex:0;padding:6px 12px">✂ ခွဲရန်</button></div><div class="timeline"><div class="needle" id="needle"></div><div class="clip"><span id="clipName">ဗီဒီယိုအပိုင်း</span></div></div><input id="seek" class="seek" type="range" min="0" max="100" value="0" aria-label="ဗီဒီယိုအချိန်ရွေးရန်"><div class="rangegrid"><div class="rangebox"><label>ဖြတ်မည့်အစ</label><output id="startOut">00:00</output><input id="start" type="range" min="0" max="100" value="0"></div><div class="rangebox"><label>ဖြတ်မည့်အဆုံး</label><output id="endOut">00:00</output><input id="end" type="range" min="0" max="100" value="100"></div></div>
<div class="quick"><button id="filter" class="qbtn">◐ စစ်ထုတ်</button><button id="textBtn" class="qbtn">T စာသား</button><button id="volume" class="qbtn">♫ သီချင်း</button></div>
<section id="aiPanel" class="aiPanel"><b>AI စာတန်း / ဇာတ်ကြောင်း</b><input id="endpoint" class="field" style="margin-top:8px" placeholder="AI backend လိပ်စာ"><div class="airow"><input id="prompt" class="field" placeholder="စာတန်း သို့မဟုတ် ဇာတ်ကြောင်းရေးရန်"><button id="ask" class="save">AI</button></div><div id="aiMsg" class="msg">AI သုံးဖို့ backend လိပ်စာချိတ်ရပါမယ်။</div><p class="small">ဒီဗားရှင်းက ဗီဒီယိုဖိုင်ကို AI ဆီမပို့သေးပါ။ စာတန်းကို ကိုယ်တိုင်ထည့်နိုင်ပါတယ်။</p></section><audio id="music" class="audioStatus" controls></audio><div id="status" class="small"></div></main>
<nav class="toolstrip"><button id="editTab" class="tool active"><i>✂</i>တည်းဖြတ်</button><button id="audioTab" class="tool"><i>♫</i>သီချင်း</button><button id="textTab" class="tool"><i>T</i>စာသား</button><button id="captionTab" class="tool"><i>✨</i>AI စာတန်း</button><button id="filterTab" class="tool"><i>◐</i>အရောင်</button><button id="moreTab" class="tool"><i>＋</i>ထပ်ထည့်</button></nav>
<input id="videoFile" type="file" accept="video/*" class="hiddenInput"><input id="audioFile" type="file" accept="audio/*" class="hiddenInput">
<script>
const $=s=>document.querySelector(s),v=$('#video'),pick=$('#videoFile'),audioPick=$('#audioFile'),music=$('#music');let videoUrl='',musicUrl='',filterIndex=0,textValue='';const filters=['none','contrast(1.12) saturate(1.15)','sepia(.3) contrast(1.08)','grayscale(.75) contrast(1.1)'];function clock(n){n=Math.max(0,Math.floor(Number(n)||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function loadVideo(f){if(!f)return;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);v.src=videoUrl;v.style.display='block';$('#empty').style.display='none';$('#clipName').textContent=f.name.slice(0,22);$('#status').textContent='ဗီဒီယိုရွေးပြီးပါပြီ။'}$('#addVideo').onclick=()=>pick.click();pick.onchange=()=>loadVideo(pick.files[0]);v.onloadedmetadata=()=>{const d=Math.floor(v.duration||0);$('#duration').textContent=clock(d);$('#end').max=$('#start').max=String(d);$('#seek').max=String(Math.max(1,d));$('#end').value=d;$('#endOut').value=clock(d)};$('#play').onclick=async()=>{if(!v.src){pick.click();return}if(v.paused){await v.play();$('#play').textContent='❚❚'}else{v.pause();$('#play').textContent='▶'}};$('#seek').oninput=()=>{if(v.duration){v.currentTime=+$('#seek').value;$('#current').textContent=clock(v.currentTime);$('#needle').style.left=`calc(${(+$('#seek').value/Math.max(1,+$('#seek').max))*100}% + 8px)`}};v.ontimeupdate=()=>{if(!v.duration)return;$('#seek').value=Math.floor(v.currentTime);$('#current').textContent=clock(v.currentTime);$('#needle').style.left=`calc(${(v.currentTime/v.duration)*100}% + 8px)`};$('#start').oninput=()=>{if(+$('#start').value>=+$('#end').value)$('#start').value=Math.max(0,+$('#end').value-1);$('#startOut').value=clock($('#start').value);v.currentTime=+$('#start').value};$('#end').oninput=()=>{if(+$('#end').value<=+$('#start').value)$('#end').value=Math.min(+$('#end').max,+$('#start').value+1);$('#endOut').value=clock($('#end').value)};$('#split').onclick=()=>{if(!v.src){pick.click();return}$('#status').textContent='အပိုင်းခွဲတဲ့လုပ်ဆောင်ချက်ကို နောက်အဆင့်မှာ ထည့်မယ်။ အခုတော့ အစနဲ့အဆုံးကို ဖြတ်ညှိနိုင်ပါတယ်။'};
function addText(){const t=prompt('ဗီဒီယိုပေါ်မှာ ပြမယ့်စာသားကို ရေးပါ');if(t!==null){textValue=t;$('#textLayer').textContent=t}}$('#textBtn').onclick=addText;$('#textTab').onclick=addText;$('#audioTab').onclick=()=>audioPick.click();$('#volume').onclick=()=>audioPick.click();audioPick.onchange=()=>{const f=audioPick.files[0];if(!f)return;if(musicUrl)URL.revokeObjectURL(musicUrl);musicUrl=URL.createObjectURL(f);music.src=musicUrl;music.style.display='block';music.play().catch(()=>{});$('#status').textContent='သီချင်းရွေးပြီးပါပြီ။ Preview အတွက်ဖွင့်ထားသည်။'};$('#filter').onclick=()=>{filterIndex=(filterIndex+1)%filters.length;v.style.filter=filters[filterIndex];$('#status').textContent='Preview အရောင်စစ်ထုတ်မှု: '+(filterIndex+1)+' / '+filters.length};$('#filterTab').onclick=()=>$('#filter').click();$('#captionTab').onclick=()=>$('#aiPanel').classList.toggle('show');$('#moreTab').onclick=()=>pick.click();const saved=localStorage.getItem('kaung-ai-endpoint-v2');if(saved)$('#endpoint').value=saved;$('#endpoint').onchange=()=>localStorage.setItem('kaung-ai-endpoint-v2',$('#endpoint').value.trim());$('#ask').onclick=async()=>{const ep=$('#endpoint').value.trim(),promptText=$('#prompt').value.trim();if(!ep){$('#aiMsg').textContent='AI backend မချိတ်ရသေးပါ။';return}if(!promptText){$('#aiMsg').textContent='AI အတွက် စာတောင်းဆိုချက် ရေးပါ။';return}$('#aiMsg').textContent='AI ကိုမေးနေသည်…';try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:promptText,videoName:pick.files[0]?.name||'',language:'my'})});const data=await r.json();if(!r.ok)throw Error();const answer=data.text||data.answer||'';$('#aiMsg').textContent=answer;if(answer){textValue=answer;$('#textLayer').textContent=answer}}catch{$('#aiMsg').textContent='မချိတ်ဆက်နိုင်ပါ။ Backend လိပ်စာကို စစ်ပါ။'}};
$('#export').onclick=async()=>{if(!v.src){pick.click();return}const capture=v.captureStream||v.mozCaptureStream;if(!capture||!window.MediaRecorder){$('#status').textContent='ဒီ browser မှာ WebM export မရသေးပါ။ Chrome browser မှာဖွင့်ပါ။';return}try{v.pause();v.currentTime=+$('#start').value;await new Promise(resolve=>v.addEventListener('seeked',resolve,{once:true}));const stream=capture.call(v);const rec=new MediaRecorder(stream);const parts=[];rec.ondataavailable=e=>e.data.size&&parts.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type:rec.mimeType||'video/webm'}));a.download='kaung-ai-edit.webm';a.click();$('#status').textContent='ဖြတ်ထားသောအပိုင်းကို WebM ဖိုင်အဖြစ်သိမ်းပြီးပါပြီ။'};rec.start();await v.play();$('#status').textContent='ဗီဒီယိုထုတ်နေသည်…';setTimeout(()=>{v.pause();rec.stop()},Math.max(1000,(+$('#end').value-+$('#start').value)*1000))}catch{$('#status').textContent='ဒီ browser မှာ export မအောင်မြင်ပါ။ Chrome မှာစမ်းပါ။'}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
